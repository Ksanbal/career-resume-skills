name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Install deterministic Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Workflow gate self-test
        run: python skills/jd-tailored-resume/scripts/self_test.py
      - name: Unit, mutation, compiler, and clean-agent runner tests
        env:
          RESUME_EVALUATION_MODE: synthetic_non_production
        run: python -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose
